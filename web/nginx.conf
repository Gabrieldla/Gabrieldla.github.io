server {
    # nginx-unprivileged no puede abrir puertos < 1024 (no es root): escucha en 8080.
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy: el navegador solo habla con nginx, y nginx le pasa /api/ a la API.
    # Sin URI después del puerto, la ruta /api/... llega tal cual al backend.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
