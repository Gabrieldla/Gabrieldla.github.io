name: CI/CD

# Un PR hacia main recorre build → test → package → security → smoke.
# Un push a main hace lo mismo y además queda esperando aprobación para publicar.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Mínimo privilegio: por defecto el workflow solo puede LEER el repositorio.
# Cada job que necesite más, lo pide para sí mismo (Reto 4).
permissions:
  contents: read

env:
  REGISTRO: ghcr.io

jobs:
  # ─────────────────────────── 2. BUILD ───────────────────────────
  build:
    name: Build y lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Las acciones de terceros van fijadas con el SHA completo del commit, no con un
      # tag: un tag se puede mover a otro código (así se comprometió tj-actions en 2025).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm          # reutiliza ~/.npm entre runs (Reto 1)
      - run: npm ci

      - name: Lint del HTML (HTMLHint)
        run: npm run lint:html

      - name: Lint de los Dockerfiles (Hadolint)
        run: |
          for d in api/Dockerfile web/Dockerfile db/Dockerfile; do
            echo "::group::$d"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml" \
              hadolint/hadolint:v2.12.0-alpine < "$d"
            echo "::endgroup::"
          done

      - name: Lint de la API (ruff)
        run: pipx run ruff==0.14.0 check api/

      - name: Armar el sitio publicable
        run: bash scripts/armar-sitio.sh

      # Sube _site/ como artefacto de Pages. Es lo único que llegará a producción:
      # ni compose.yaml, ni api/, ni db/, ni .env.example.
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  # ─────────────────────────── 3. TEST ───────────────────────────
  test:
    name: Pruebas
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm          # reutiliza ~/.npm entre runs (Reto 1)
      - run: npm ci

      # El mismo script que usó build: se prueba exactamente lo que se publica.
      - name: Armar el sitio publicable
        run: bash scripts/armar-sitio.sh

      - name: Vitest sobre _site/
        run: npm test 2>&1 | tee vitest.txt

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Pruebas de la API (pytest)
        working-directory: api
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest tests -q | tee ../pytest.txt

      # Quien aprueba el despliegue tiene que saber qué está aprobando sin abrir
      # cuatro logs: el resumen del run lo cuenta en una tabla (Reto 6).
      - name: Resumen de las pruebas
        if: always()
        run: |
          {
            echo "## Pruebas"
            echo ""
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| Vitest (sitio) | $(grep -oE "Tests[[:space:]]+[0-9]+ passed" vitest.txt || echo "ver log") |"
            echo "| pytest (API) | $(grep -oE "[0-9]+ passed" pytest.txt || echo "ver log") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────── 3b. INTEGRACIÓN con Compose (Reto 3) ───────────────
  # Vitest prueba el sitio y pytest la validación de la API, pero por separado.
  # Esto levanta la aplicación entera y prueba el contrato entrando por nginx.
  integracion:
    name: Integración con Compose
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # El runner no tiene mi .env, igual que un Codespace recién creado: el mismo
      # script del LAB-02 le genera uno con una contraseña aleatoria.
      - name: Generar el .env
        run: bash scripts/crear-env.sh

      - name: Levantar los tres servicios
        run: docker compose up -d --build --wait

      - name: Probar el contrato de la API a través de nginx
        run: bash scripts/probar-integracion.sh

      # Sin esto, un fallo deja un log inútil. Con esto se ve qué contenedor murió.
      - name: Logs de los contenedores si algo falló
        if: failure()
        run: docker compose logs --tail 50

      - name: Apagar
        if: always()
        run: docker compose down -v

  # ─────────────────────────── 4. PACKAGE ───────────────────────────
  package:
    name: Publicar imagen
    # Antes esperaba también a integracion. Publicar una imagen no es desplegarla:
    # si la integración falla, la compuerta de producción lo frena igual, y mientras
    # tanto el pipeline avanza (Reto 1).
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # lo único que este job necesita de más
    strategy:
      matrix:
        include:
          - imagen: perfil-web
            contexto: .
            dockerfile: web/Dockerfile
          - imagen: perfil-api
            contexto: ./api
            dockerfile: api/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Se publica con el GITHUB_TOKEN del propio workflow: sin tokens personales.
      # El driver por defecto de buildx no sabe exportar caché: hace falta el driver
      # docker-container, que es lo que instala esta acción (Reto 1).
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Arma el tag a partir del commit (sha-1a2b3c4) y las etiquetas OCI,
      # entre ellas image.source, que conecta el paquete con este repositorio.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRO }}/${{ github.repository_owner }}/${{ matrix.imagen }}
          tags: type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reutiliza las capas del run anterior: si solo cambió el HTML, no se
          # vuelve a instalar nada (Reto 1).
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  # ─────────────────────────── 5. SECURITY ───────────────────────────
  # Dos capas distintas: Trivy revisa lo que HEREDO (sistema operativo y librerías de
  # las imágenes) y Semgrep revisa lo que ESCRIBO (mi Python y mi JavaScript).
  # Los hallazgos de ambos se publican en Security → Code scanning (Reto 2).
  security:
    name: Escaneo y SAST
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # descargar las imágenes, no publicarlas
      security-events: write  # subir los informes SARIF a Code scanning
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Calcular el tag y el propietario
        env:
          PROPIETARIO: ${{ github.repository_owner }}
        run: |
          {
            echo "TAG=sha-${GITHUB_SHA:0:7}"
            echo "DUENIO=${PROPIETARIO,,}"
            echo "TRIVY_CACHE_DIR=${GITHUB_WORKSPACE}/.cache/trivy"
          } >> "$GITHUB_ENV"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # La base de datos de vulnerabilidades pesa cientos de MB y Trivy la baja en
      # cada run. Se guarda por día: sigue estando al día y deja de descargarse cuatro
      # veces seguidas (Reto 1).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # ── Trivy: informe completo para Code scanning ──
      # exit-code 0 a propósito: este paso informa, no decide. Quien decide es el paso
      # siguiente. Así el informe se sube aunque después el pipeline se frene.
      - name: Trivy sobre perfil-web (informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/${{ env.DUENIO }}/perfil-web:${{ env.TAG }}
          scan-type: image
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy sobre perfil-api (informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/${{ env.DUENIO }}/perfil-api:${{ env.TAG }}
          scan-type: image
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH,MEDIUM

      # Un informe por categoría: CodeQL ya no admite combinar varios en una sola,
      # y así en Code scanning se distingue qué hallazgo viene de qué imagen.
      - name: Publicar los hallazgos de Trivy (web)
        if: always() && hashFiles('trivy-web.sarif') != ''
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web

      - name: Publicar los hallazgos de Trivy (api)
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      # Cuántas vulnerabilidades hay y de qué gravedad, en el resumen del run, para
      # que quien aprueba no tenga que abrir el SARIF (Reto 6).
      - name: Resumen de seguridad
        if: always()
        run: |
          contar() {
            python3 - "$1" <<'PY'
          import json, sys, collections
          try:
              d = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("(sin informe)"); raise SystemExit
          niveles = collections.Counter()
          reglas = {r["id"]: r for r in d["runs"][0]["tool"]["driver"].get("rules", [])}
          for res in d["runs"][0].get("results", []):
              r = reglas.get(res.get("ruleId"), {})
              sev = (r.get("properties", {}) or {}).get("security-severity")
              nivel = res.get("level", "warning")
              if sev:
                  v = float(sev)
                  nivel = "critical" if v >= 9 else "high" if v >= 7 else "medium" if v >= 4 else "low"
              niveles[nivel] += 1
          print(", ".join(f"{k}: {v}" for k, v in sorted(niveles.items())) or "sin hallazgos")
          PY
          }
          {
            echo "## Seguridad"
            echo ""
            echo "| Análisis | Hallazgos |"
            echo "|---|---|"
            echo "| Trivy (perfil-web) | $(contar trivy-web.sarif) |"
            echo "| Trivy (perfil-api) | $(contar trivy-api.sarif) |"
            echo "| Semgrep (mi código) | $(contar semgrep.sarif) |"
            echo ""
            echo "Las vulnerabilidades aceptadas a conciencia están en \`.trivyignore\`, con su motivo."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── La compuerta: esto SÍ frena el pipeline ──
      # Solo las críticas CON parche disponible. Las aceptadas a conciencia están en
      # .trivyignore, cada una con su motivo escrito.
      - name: Frenar si hay una vulnerabilidad crítica con parche
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/${{ env.DUENIO }}/perfil-web:${{ env.TAG }}
          scan-type: image
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Frenar si hay una vulnerabilidad crítica con parche (api)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRO }}/${{ env.DUENIO }}/perfil-api:${{ env.TAG }}
          scan-type: image
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

  # ─────────────────────── 5b. SAST (Reto 2) ───────────────────────
  # Semgrep revisa el código fuente, no las imágenes: no depende de package y por eso
  # arranca a la vez que todo lo demás, en vez de esperar al final (Reto 1).
  sast:
    name: SAST del código
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Semgrep sobre mi código
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.142.0
          semgrep scan --config=p/default --config=p/secrets
          --sarif --output=semgrep.sarif --metrics=off --no-git-ignore .

      - name: Publicar los hallazgos de Semgrep
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─────────────────────────── 7. SMOKE ───────────────────────────
  smoke:
    name: Smoke test
    # Corre a la vez que security: las dos miran la misma imagen ya publicada y no
    # dependen entre sí. Nada llega a producción sin las dos, porque deploy-prod las
    # necesita a ambas: adelantar trabajo no es saltarse una compuerta.
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Mismo commit que usó metadata-action al publicar (en un PR, github.sha es el
      # commit de merge), y el propietario en minúsculas: una referencia OCI con
      # mayúsculas no es válida y Trivy la rechaza al parsearla.
      - name: Calcular el tag y el propietario
        env:
          PROPIETARIO: ${{ github.repository_owner }}
        run: |
          echo "TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "DUENIO=${PROPIETARIO,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar la imagen que acaba de escanearse
        run: |
          docker run -d --name smoke -p 8080:8080 \
            "${REGISTRO}/${DUENIO}/perfil-web:${TAG}"

      - name: GET / responde 200 y trae mi nombre
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ -o /tmp/pagina.html; then break; fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -q "Gabriel De la Rivera" /tmp/pagina.html
          echo "El sitio responde y muestra mi nombre."

      - name: Logs del contenedor si algo falló
        if: failure()
        run: docker logs smoke

      - name: Apagar
        if: always()
        run: docker rm -f smoke

  # ─────────────────────────── 8. DEPLOY PROD ───────────────────────────
  deploy-prod:
    name: Desplegar a producción
    # El SAST corre en paralelo, pero sigue siendo una compuerta: si encuentra algo
    # que rompa el job, a producción no se llega.
    needs: [smoke, security, sast, integracion]
    # Un pull request nunca despliega: solo el merge a main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # El environment github-pages tiene Required reviewers: el job se queda esperando
    # aquí hasta que una persona apruebe. Esto es Continuous Delivery, no Deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # Que deploy-pages termine en verde solo dice que GitHub aceptó el artefacto.
      # Esto entra por la URL real y comprueba qué sirve de verdad el sitio (Reto 5).
      - name: Verificar el sitio publicado
        run: bash scripts/verificar-produccion.sh "${{ steps.deployment.outputs.page_url }}"

      - name: Resumen del despliegue
        if: always()
        run: |
          {
            echo "## Despliegue a produccion"
            echo ""
            echo "- Sitio: ${{ steps.deployment.outputs.page_url }}"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Aprobado por: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
