name: perfil

services:
  web:
    build:
      # El contexto es la raíz (ahí está index.html); el Dockerfile vive en web/.
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy   # nginx no arranca hasta que la API esté sana

  api:
    build: ./api
    environment:
      # Una sola fuente de verdad: la API usa las mismas variables que crean la base.
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-libro}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Crea tu .env a partir de .env.example}
    depends_on:
      db:
        condition: service_healthy   # depends_on solo no espera: sin esto la API arranca antes que Postgres

  db:
    build: ./db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libro}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Crea tu .env a partir de .env.example}
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      # $$ para que Compose no reemplace la variable: la expande el shell del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  datos-db:
