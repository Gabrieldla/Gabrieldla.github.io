name: perfil

services:
  web:
    build:
      # El contexto es la raíz (ahí está index.html); el Dockerfile vive en web/.
      context: .
      dockerfile: web/Dockerfile
    # Nombre con el que se publica en GHCR (B5). Tag fijo, nunca latest.
    image: ghcr.io/gabrieldla/perfil-web:1.0
    ports:
      # El único puerto publicado hacia el host de toda la aplicación.
      - "8080:8080"
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy   # nginx no arranca hasta que la API esté sana

  api:
    build: ./api
    image: ghcr.io/gabrieldla/perfil-api:1.0
    environment:
      # Una sola fuente de verdad: la API usa las mismas variables que crean la base.
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-libro}
      DB_USER: ${POSTGRES_USER:-app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Crea tu .env a partir de .env.example}
    depends_on:
      db:
        condition: service_healthy   # depends_on solo no espera: sin esto la API arranca antes que Postgres
    networks:
      # El único servicio en las dos redes: es el puente obligado entre web y db.
      - frontend
      - backend

  db:
    build: ./db
    image: perfil-db:1.0
    # Solo se construye en local: esta imagen no se publica.
    pull_policy: build
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-libro}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD. Crea tu .env a partir de .env.example}
    networks:
      - backend
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      # $$ para que Compose no reemplace la variable: la expande el shell del contenedor.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  # Dos switches virtuales distintos. Un servicio solo alcanza a los que están
  # enchufados a su misma red, así que no existe ningún camino de web a db.
  frontend:
  backend:

volumes:
  datos-db:
